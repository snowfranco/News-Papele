name: manifold feed ingest

# Fetches every enabled feed in context.sources.feeds and upserts fresh items
# into reading_items, so manifold's editorial pass and the app's Feeds tab
# share one server-refreshed corpus. Replaces the browser-only refresh path
# (src/state/AppStore.tsx refreshFeeds), which relied on three anonymous CORS
# proxies that all yanked free-tier access in 2026-08 (rss2json 422 without
# an api key, allorigins 522, corsproxy.io 403 keyless_legacy_url). Node
# fetches feeds directly, no proxy, no third-party dependency.
#
# The ingester never calls the model, so it needs only the Supabase key
# (no Anthropic auth). Upserts are idempotent (manifold/src/ingest.ts, on
# conflict id, ignore duplicates), so a run GitHub Actions delays, doubles,
# or drops under load is harmless.
#
# Disable switch (any one pauses it):
#   1. Set the repository variable MANIFOLD_INGEST_ENABLED to "false".
#   2. Comment out the `schedule` line below.
#   3. Disable this workflow in the Actions tab.

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours (UTC; timezone-agnostic)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: manifold-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ vars.MANIFOLD_INGEST_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: fetch and upsert feed items
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run manifold:ingest

      - name: upload run report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: manifold-ingest-report-${{ github.run_id }}
          path: manifold/reports/
          if-no-files-found: ignore
          retention-days: 30
